name: Factory publication smoke

on:
  workflow_run:
    # GitHub exposes different names on the built-in workflow and its runs.
    workflows: [pages-build-deployment, pages build and deployment]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-publication-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deployed-events:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Read the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: expected-publication
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: history/package-lock.json

      - run: npm ci
        working-directory: history

      - run: npx playwright install --with-deps chromium
        working-directory: history

      - name: Verify deployed artifacts and visible accepted events
        env:
          DEPLOYED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node history/tests/check-published.mjs
          --expected-root expected-publication
          --base-url https://haibalabs.github.io/
          --commit "$DEPLOYED_COMMIT"
          --output publication-smoke

      - name: Save report and browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-smoke-${{ github.event.workflow_run.head_sha }}
          path: publication-smoke/
          if-no-files-found: warn
          retention-days: 30
