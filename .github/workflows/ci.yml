name: CI

# CI minutes are billed, so CI runs once a pull request to main is ready for review, and again on each push while
# it stays ready. Pushes to a draft don't run it; to check a draft, run it by hand: gh workflow run CI --ref <branch>.
# main isn't tested again after a merge: the ruleset already requires each pull request to be up to date with main
# and green.
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# One job for each check main requires. A job's setup (checkout, npm packages, Chromium, the emulators) bills as
# much as its tests, so the tests are not split across more jobs.
jobs:
  unit-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare

      - name: Syntax check
        working-directory: ./history
        run: npm run test:syntax

      - name: Run unit tests
        working-directory: ./history
        run: npm run test:unit

  e2e-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          browsers: 'true'

      - name: Run E2E tests
        env:
          PORT: 8181
        working-directory: ./history
        run: npm run test:e2e -- --workers=2

  firebase-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      # the Firebase tests use small fixtures, so they skip the large data files
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/history/canonical-t2.json
            !/history/events.json
            !/history/data/
      - uses: ./.github/actions/prepare
        with:
          browsers: 'true'
          firebase: 'true'
          emulators: 'true'

      # the emulators were started during setup (firebase.json gives their ports)
      - name: Wait for the emulators
        run: |
          timeout 90 bash -c 'until grep -q "All emulators ready" "$RUNNER_TEMP/emulators.log"; do sleep 0.5; done' \
            || { cat "$RUNNER_TEMP/emulators.log"; exit 1; }

      # the tests of npm run test:rules, against the emulators already running
      - name: Firestore and Storage rules tests
        working-directory: ./history/firebase
        run: node --test --test-concurrency=1 tests/*.test.js

      - name: Sign-in tests against the emulators
        env:
          PORT: 8181
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
        working-directory: ./history/firebase
        run: npm run test:flows
