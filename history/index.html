<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="copyright" content="© 2025 Haiba LLC. All rights reserved.">
    <meta name="author" content="Haiba LLC">
    <meta name="description" content="An interactive timeline of historical events">
    <meta name="robots" content="noindex, nofollow">

    <meta property="og:title" content="HistoriLine">
    <meta property="og:description" content="An interactive timeline of historical events">
    <meta property="og:type" content="website">

    <title>HistoriLine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
         integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
         crossorigin="" />
         
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
         integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
         crossorigin=""></script>
</head>
<body>
    <div class="page-container">
        <div class="content-wrap">
            <div class="header">
                <h1>What Happened Was..</h1>
                <div class="controls-row">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search events...">
                    </div>
                    <button id="add-event" class="nav-button">
                        <span>+</span>
                    </button>
                </div>
            </div>
            <div class="controls-panel">
                <div class="date-navigation">
                    <button class="nav-button" id="jumpStart">⟪</button>
                    <input type="text" id="dateInput" placeholder="Year">
                    <button class="nav-button" id="jumpEnd">⟫</button>
                </div>
                <div class="filters">
                    <!-- Buttons injected by JS -->
                </div>
                <button class="toggle-controls-btn">›</button>
            </div>
            <div class="timeline-wrapper" id="timeline-wrapper">
                <div class="timeline" id="timeline">
                    <div id="timeline-placeholder"></div>  <!-- Controls total scrollable height -->
                    <div id="timeline-content"></div>      <!-- Contains visible events -->
                </div>
                <div id="map-panel" class="map-panel">
                    <div id="map"></div>
                    <button id="toggle-map" class="toggle-map-btn">
                        <span class="map-icon">🗺️</span>
                    </button>
                </div>
                <div id="info-panel" class="info-panel">
                    <iframe id="info-frame" class="info-frame"></iframe>
                    <button id="toggle-info" class="toggle-info-btn">
                        <span class="info-icon">ℹ️</span>
                    </button>
                </div>
            </div>
        </div><!-- End content-wrap -->
        <footer class="site-footer">
            <div class="copyright">
                © 2025 Haiba LLC. All rights reserved.
                <br>
                Unauthorized use or distribution of this website or its content is prohibited.
            </div>
            <button id="settings-btn" class="settings-btn">⚙️</button>
        </footer>        
    </div><!-- End page-container -->
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h3>Settings</h3>
        </div>
        <div class="settings-info">
            <p>Version: <span class="version">v<span id="versionNumber"></span></span></p>
            <p>Events: <span id="visibleCount">0</span> of <span id="totalCount">0</span> Events</p>
        </div>
        <div class="settings-content">
            <div class="settings-group">
                <h4>Debug Options</h4>
                <label class="settings-toggle">
                    <input type="checkbox" id="debug-scroll">
                    Scroll metrics
                </label>
            </div>
        </div>
        <button class="settings-close-btn">Close</button>
    </div>
    <div class="modal-overlay" id="add-event-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Event</h3>
            </div>
            <form id="add-event-form" class="modal-form">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" name="name" required
                            placeholder="This has to be a unique name">
                </div>
                
                <div class="form-group">
                    <label>Time</label>
                    <input type="text" name="enhanced_time" required 
                           placeholder="e.g. 1/25/1976, 750, 15 BC, March 982, Late Spring 1204">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="enhanced_description" required rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <div class="location-fields">
                        <input type="text" name="location_name" placeholder="Name">
                        <input type="text" name="location_city" placeholder="City">
                        <input type="text" name="location_region" placeholder="Region">
                        <input type="text" name="location_country" placeholder="Country">
                        <input type="text" name="location_historical" placeholder="Historical Name">
                    </div>
                </div>
    
                <div class="form-group">
                    <label>Categories</label>
                    <select name="categories">
                    </select>
                </div>
        
                <div class="form-group">
                    <label>Source URL</label>
                    <input name="wikipedia_url" 
                            pattern="^(https?:\/\/)?([\w-]+\.)+[\w-]+(\/[\w- .\/?%&=]*)?$"
                            placeholder="e.g. www.wikipedia.org/wiki/page">
                </div>
    
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-add">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>    
    <script type="module" src="script.js"></script>
</body>
</html>
