<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="copyright" content="© 2025 Haiba LLC. All rights reserved.">
    <meta name="author" content="Haiba LLC">
    <meta name="description" content="An interactive timeline of historical events">
    <meta name="robots" content="noindex, nofollow">

    <meta property="og:title" content="HistoriLine">
    <meta property="og:description" content="An interactive timeline of historical events">
    <meta property="og:type" content="website">

    <title>HistoriLine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
         integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
         crossorigin="" />

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
         integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
         crossorigin=""></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/47a1fab6e7.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="content-wrap">
            <header class="header">
                <div class="bar">
                    <a class="brand" href="./" title="HistoriLine">
                        <img src="assets/history-logo.png" alt="">
                        <span>HistoriLine</span>
                    </a>
                    <div class="search-box">
                        <i class="fa-light fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search history" autocomplete="off">
                        <button id="clearSearch" class="search-clear" title="Clear search"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="date-navigation">
                        <button class="nav-button" id="jumpStart" title="Earliest"><i class="fa-sharp fa-light fa-backward-step"></i></button>
                        <input type="text" id="dateInput" placeholder="Year" inputmode="numeric" autocomplete="off">
                        <button class="nav-button" id="jumpEnd" title="Latest"><i class="fa-sharp fa-light fa-forward-step"></i></button>
                    </div>
                    <div class="crumbs" id="crumbs"></div>
                    <div class="action-buttons">
                        <button id="randomEvent" class="icon-btn" title="I'm feeling lucky"><i class="fa-light fa-dice"></i></button>
                        <button id="add-event" class="icon-btn" title="Add event"><i class="fa-light fa-plus"></i></button>
                        <button id="settings-btn" class="icon-btn" title="Settings"><i class="fa-light fa-sliders"></i></button>
                    </div>
                </div>
                <nav class="filters" aria-label="Categories"><!-- Buttons injected by JS --></nav>
            </header>

            <!-- kept for initControls(); hidden in this layout -->
            <div class="controls-panel is-hidden"><button class="toggle-controls-btn"></button></div>

            <div id="spine" class="spine" title="Drag to travel through time">
                <div id="spine-track" class="spine-track"></div>
                <div id="spine-thumb" class="spine-thumb"></div>
                <div id="spine-bubble" class="spine-bubble"></div>
            </div>
            <div id="popover" class="popover"></div>

            <div class="timeline-wrapper" id="timeline-wrapper">
                <div class="timeline" id="timeline">
                    <div id="timeline-placeholder"></div>
                    <div id="timeline-content"></div>
                </div>
                <div id="map-panel" class="map-panel">
                    <div id="map"></div>
                    <button id="toggle-map" class="toggle-map-btn panel-tab" title="Map: click to bring forward, again to close"><i class="fa-light fa-map-location-dot ico"></i><i class="fa-light fa-xmark x"></i></button>
                </div>
                <div id="info-panel" class="info-panel">
                    <iframe id="info-frame" class="info-frame"></iframe>
                    <button id="toggle-info" class="toggle-info-btn panel-tab" title="Wikipedia: click to bring forward, again to close"><i class="fa-sharp fa-light fa-book ico"></i><i class="fa-light fa-xmark x"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="settings-panel">
        <div class="settings-content">
            <h3>Profile</h3>
            <div id="auth-section">
                <div id="login-form" class="auth-form">
                    <input type="email" id="email" placeholder="Email">
                    <input type="password" id="password" placeholder="Password">
                    <button class="auth-btn" id="login-btn">Log in</button>
                </div>
                <div id="user-info" class="auth-info" style="display: none;">
                    <span id="user-email"></span>
                    <button class="auth-btn" id="logout-btn">Log out</button>
                </div>
                <p id="auth-status" class="auth-status" role="status" hidden></p>
            </div>
            <div class="settings-group" id="debug-settings" hidden>
                <h4>Sync</h4>
                <div class="sync-controls" style="display: none">
                    <button id="push-changes" class="settings-btn" disabled><i class="fa-light fa-cloud-arrow-up"></i> Push</button>
                    <button id="pull-changes" class="settings-btn" disabled><i class="fa-light fa-cloud-arrow-down"></i> Pull</button>
                    <div class="sync-status"></div>
                </div>
                <h4>Debug</h4>
                <label class="settings-toggle"><input type="checkbox" id="debug-scroll"> Scroll metrics</label>
                <label class="settings-toggle"><input type="checkbox" id="debug-add-event" disabled> Enable adding events</label>
                <label class="settings-toggle"><input type="checkbox" id="debug-sync" disabled> Enable sync events</label>
            </div>
        </div>
        <div class="settings-info">
            <p>Version <span class="version">v<span id="versionNumber"></span></span> · <span id="visibleCount">0</span> of <span id="totalCount">0</span> events</p>
            <p class="settings-legal">© 2025 Haiba LLC. All rights reserved.<br>Unauthorized use or distribution of this website or its content is prohibited.</p>
        </div>
        <button class="settings-close-btn">Close</button>
    </div>

    <div class="modal-overlay" id="add-event-modal">
        <div class="modal">
            <div class="modal-header"><h3>Add event</h3></div>
            <form id="add-event-form" class="modal-form">
                <div class="form-group"><label>Event name</label><input type="text" name="name" required placeholder="This has to be a unique name"></div>
                <div class="form-group"><label>Time</label><input type="text" name="enhanced_time" required placeholder="e.g. 1/25/1976, 750, 15 BC, March 982, Late Spring 1204"></div>
                <div class="form-group"><label>Description</label><textarea name="enhanced_description" required rows="3"></textarea></div>
                <div class="form-group">
                    <label>Location</label>
                    <div class="location-fields">
                        <input type="text" name="location_name" placeholder="Name">
                        <input type="text" name="location_city" placeholder="City">
                        <input type="text" name="location_region" placeholder="Region">
                        <input type="text" name="location_country" placeholder="Country">
                        <input type="text" name="location_historical" placeholder="Historical name">
                    </div>
                </div>
                <div class="form-group"><label>Categories</label><select name="categories"></select></div>
                <div class="form-group"><label>Source URL</label><input name="wikipedia_url" pattern="^(https?:\/\/)?([\w-]+\.)+[\w-]+(\/[\w- .\/?%&=]*)?$" placeholder="e.g. www.wikipedia.org/wiki/page"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-add">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
