<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"> 
    <title>History Timeline Dev Journal</title>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            font-size: smaller;
            margin: 0;
            display: flex;
            flex-direction: row;
        }

        /* Main content styling */
        #markdown-content {
            flex: 1;
            margin-left: 40px;
            padding: 20px;
        }

        hr {
            border: none;            /* Removes the default border */
            height: 1px;             /* Adjusts the thickness */
            background-color: #e2e2e2;  /* Sets the line color */
            margin: 0;          /* Adjusts spacing around the line */
        }

        h1, h2, h3, h4, h5, h6 {
            color: #606060;
            font-weight: normal;
        }

        ul {
            list-style-type: square;
            padding-left: 20px;
        }

        ol {
            list-style-type: upper-roman;
            padding-left: 20px;
        }

        li::marker {
            content: '';
        }

        ol li::marker {
            content: normal; /* Use the default numbering */
        }

        blockquote {
            font-style: italic;
            color: #555;
            border-left: 4px solid #ccc;
            padding-left: 10px;
            margin-left: 0;
            background: #f9f9f9;
        }

        code {
            font-family: 'Courier New', monospace;
            background: #f4f4f4;
            padding: 2px 4px;
            border-radius: 4px;
        }

        pre {
            background: #f1f1f1;
            padding: 10px;
            border: 1px solid #ddd;
            overflow: auto;
        }

        /* TOC styling */
        #toc {
            position: fixed;
            top: 0;
            left: -200px;
            width: 200px;
            height: 100%;
            background: #f4f4f4;
            border-right: 1px solid #ccc;
            overflow-y: auto;
            transition: left 0.3s ease;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        #toc.open {
            left: 0;
        }

        #toc h3 {
            margin-top: 0;
        }

        #toc a {
            text-decoration: none;
            color: #606060;
            font-size: 0.9em;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="toc">
        <h3>A Thousand Miles</h3>
        <div id="toc-list"></div>
    </div>
    <div id="markdown-content"></div>
    <!-- Include Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Fetch and render Markdown content
            fetch('dev-journal.md')
                .then(response => response.text())
                .then(markdown => {
                    const parsedHTML = marked.parse(markdown);
                    const contentDiv = document.getElementById('markdown-content');
                    contentDiv.innerHTML = parsedHTML;

                    // Generate Table of Contents
                    const tocList = document.getElementById('toc-list');
                    const headings = contentDiv.querySelectorAll('h3');
                    headings.forEach((heading, index) => {
                        // Add IDs to headings for navigation
                        const id = `heading-${index}`;
                        heading.id = id;

                        // Create TOC link
                        const link = document.createElement('a');
                        link.href = `#${id}`;
                        link.textContent = heading.textContent;
                        tocList.appendChild(link);
                    });
                })
                .catch(error => {
                    console.error('Error loading markdown:', error);
                });

            // TOC Toggle functionality
            const toc = document.getElementById('toc');
            toc.addEventListener('click', () => {
                toc.classList.toggle('open');
            });
        });
    </script>
</body>
</html>
